<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="game-header">
            <h1 class="title">Tic Tac Toe</h1>
            <p class="subtitle">Classic 3x3 Strategy Game</p>
        </header>

        <!-- Mode & Difficulty Selectors -->
        <div class="controls-panel">
            <div class="control-group">
                <label for="modeSelect" class="control-label">Game Mode</label>
                <select id="modeSelect" class="select-input">
                    <option value="pvp">👥 2 Players (Local)</option>
                    <option value="pvc" selected>🤖 vs Computer</option>
                </select>
            </div>

            <div class="control-group" id="difficultyGroup">
                <label for="difficultySelect" class="control-label">AI Difficulty</label>
                <select id="difficultySelect" class="select-input">
                    <option value="easy">🌱 Easy</option>
                    <option value="medium">⚡ Medium</option>
                    <option value="hard" selected>🔥 Hard (Unbeatable)</option>
                </select>
            </div>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-card player-x">
                <span class="score-label" id="labelX">Player X</span>
                <span class="score-value" id="scoreX">0</span>
            </div>
            <div class="score-card ties">
                <span class="score-label">Draws</span>
                <span class="score-value" id="scoreTies">0</span>
            </div>
            <div class="score-card player-o">
                <span class="score-label" id="labelO">Computer (O)</span>
                <span class="score-value" id="scoreO">0</span>
            </div>
        </div>

        <!-- Game Status -->
        <div class="status-banner">
            <div class="status-message" id="statusMessage">Player X's Turn</div>
        </div>

        <!-- 3x3 Game Board -->
        <div class="board" id="board" role="grid" aria-label="Tic Tac Toe Board">
            <button class="cell" data-index="0" aria-label="Cell 1"></button>
            <button class="cell" data-index="1" aria-label="Cell 2"></button>
            <button class="cell" data-index="2" aria-label="Cell 3"></button>
            <button class="cell" data-index="3" aria-label="Cell 4"></button>
            <button class="cell" data-index="4" aria-label="Cell 5"></button>
            <button class="cell" data-index="5" aria-label="Cell 6"></button>
            <button class="cell" data-index="6" aria-label="Cell 7"></button>
            <button class="cell" data-index="7" aria-label="Cell 8"></button>
            <button class="cell" data-index="8" aria-label="Cell 9"></button>
        </div>

        <!-- Game Action Buttons -->
        <div class="action-buttons">
            <button id="restartBtn" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                </svg>
                Restart Game
            </button>
            <button id="resetScoreBtn" class="btn btn-secondary">Reset Scores</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
